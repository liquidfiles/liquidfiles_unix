name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Strip binary
        run: strip build/liquidfiles

      - name: Create tarball
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p stage dist
          cp build/liquidfiles stage/
          cp README.md CHANGELOG.md test.sh stage/
          tar czf dist/liquidfiles-${TAG}-linux-${{ matrix.arch }}.tar.gz -C stage .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidfiles-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
